<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bite Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1d14; --cream:#fff6e6; --accent:#ff6b3d; --accent-dk:#c4441c;
  --gold:#ffc23d; --muted:#7a6656; --panel:#fff6e6; --edge:#d9b88f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1d1410;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(29,20,16,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px;z-index:10}
.overlay.show{display:flex}
.card{background:var(--panel);border-radius:24px;padding:22px 26px 24px;width:100%;max-width:660px;max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 var(--edge),0 24px 50px rgba(0,0,0,.45)}
.card.small{max-width:420px}
.kicker{font-weight:900;text-transform:uppercase;letter-spacing:.18em;font-size:12px;color:var(--muted)}
h1{font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(46px,9vw,84px);line-height:1;color:var(--accent);letter-spacing:2px;text-shadow:0 5px 0 var(--accent-dk),0 10px 0 rgba(0,0,0,.12);margin:6px 0 4px}
h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(34px,6vw,50px);color:var(--accent);text-shadow:0 4px 0 var(--accent-dk);line-height:1.05;margin-bottom:6px}
.tag{font-weight:800;color:var(--muted);margin-bottom:14px}
.label{font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.seg{display:inline-flex;background:#f0dfc4;border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;font:inherit;font-weight:900;padding:8px 18px;border-radius:10px;cursor:pointer;color:var(--ink);font-size:15px}
.seg button.on{background:var(--ink);color:var(--cream)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{border:3px solid #ead3b2;background:#fff;border-radius:14px;padding:8px 4px;cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s}
.lv:hover:not(:disabled){transform:translateY(-2px)}
.lv b{display:block;font-family:'Lilita One';font-weight:400;font-size:24px;line-height:1}
.lv span{display:block;font-size:11px;font-weight:800;color:var(--muted);line-height:1.2;margin-top:2px}
.lv.on{border-color:var(--accent);background:#fff1e8}
.lv:disabled{opacity:.45;cursor:not-allowed}
.btn{border:0;font:inherit;font-weight:900;cursor:pointer;background:var(--accent);color:#fff;border-radius:16px;padding:12px 26px;font-size:18px;box-shadow:0 5px 0 var(--accent-dk);transition:transform .08s,box-shadow .08s;margin:4px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dk)}
.btn.big{font-size:22px;padding:14px 44px;margin-top:16px}
.btn.ghost{background:#efe0c8;color:var(--ink);box-shadow:0 5px 0 #cdb58f}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-top:16px;font-size:13px;font-weight:800;color:var(--muted)}
kbd{display:inline-block;background:#fff;border:2px solid #e2cba9;border-bottom-width:4px;border-radius:7px;padding:1px 7px;font:inherit;font-weight:900;color:var(--ink);font-size:12px}
.best{margin-top:10px;font-size:13px;font-weight:800;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 18px;text-align:left;margin:14px auto 16px;max-width:280px;font-weight:800}
.stats .v{text-align:right;font-weight:900}
.stats .tot{border-top:2px dashed #e2cba9;padding-top:6px;font-size:20px;color:var(--accent)}
#corner{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;z-index:5}
.icon{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,246,230,.9);font-size:18px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);color:var(--ink);font-weight:900}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:6;pointer-events:none}
#touch .tg{display:flex;gap:10px;pointer-events:auto}
#touch button{touch-action:none;width:68px;height:68px;border-radius:50%;border:0;background:rgba(255,246,230,.82);font:inherit;font-weight:900;font-size:13px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.3)}
#touch button.hot{background:var(--accent);color:#fff}
#touch button.arrow{font-size:24px}
@media (pointer:coarse){ #touch.live{display:flex} }
@media (max-width:560px){ .levels{grid-template-columns:repeat(3,1fr)} .card{padding:18px 16px} }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" aria-label="Bite Club game"></canvas>
    <div id="corner">
      <button class="icon" id="muteBtn" title="Mute (M)">♪</button>
      <button class="icon" id="pauseBtn" title="Pause (P)">II</button>
    </div>
  </div>
</div>

<div id="menu" class="overlay show">
  <div class="card">
    <div class="kicker">a doggone chomp-'em-up</div>
    <h1>BITE CLUB</h1>
    <p class="tag">Rule #1 of Bite Club: chomp every human you meet.</p>
    <div class="label">Difficulty</div>
    <div class="seg" id="diffs">
      <button data-d="easy">Easy</button>
      <button data-d="normal">Normal</button>
      <button data-d="hard">Hard</button>
    </div>
    <div class="label">Level</div>
    <div class="levels" id="levels"></div>
    <button class="btn big" id="playBtn">▶ Play</button>
    <div class="keys">
      <span><kbd>→</kbd>/<kbd>D</kbd> run</span>
      <span><kbd>←</kbd>/<kbd>A</kbd> back off</span>
      <span><kbd>Space</kbd>/<kbd>↑</kbd> jump</span>
      <span><kbd>Shift</kbd> sprint</span>
      <span><kbd>X</kbd>/<kbd>J</kbd> bite</span>
      <span><kbd>P</kbd> pause</span>
    </div>
    <div class="best">Best score: <span id="bestScore">0</span></div>
  </div>
</div>

<div id="pauseO" class="overlay">
  <div class="card small">
    <h2>Paused</h2>
    <p class="tag">Sit. Stay. Good dog.</p>
    <button class="btn" id="resumeBtn">Resume</button>
    <button class="btn ghost" id="quitBtn">Quit to menu</button>
  </div>
</div>

<div id="resultO" class="overlay">
  <div class="card small">
    <h2 id="rTitle"></h2>
    <p class="tag" id="rSub"></p>
    <div class="stats" id="rStats"></div>
    <div id="rBtns"></div>
  </div>
</div>

<div id="touch">
  <div class="tg">
    <button class="arrow" data-t="left">◀</button>
    <button class="arrow" data-t="right">▶</button>
  </div>
  <div class="tg">
    <button data-t="sprint">SPRINT</button>
    <button data-t="bite">BITE</button>
    <button data-t="jump">JUMP</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ---------- constants & config ---------- */
const W = 960, H = 540, GROUND = 462, GRAV = 2100, HGRAV = 1800;
const DOG_S = 0.5;                   // dog render scale
const DOG_X1 = 14*DOG_S, DOG_X2 = 80*DOG_S;  // dog body hitbox (relative to dog.x)
const BITE_TIME = 0.24, BITE_CD = 0.42;

const LEVELS = [
  { name:'Sunny Park',      theme:'park',     goal:8,  time:75, hgap:[380,600], aware:.25, gap:[520,900], flee:200,
    obs:['box','bench'], types:{walker:6,jogger:2,business:0,skater:0} },
  { name:'Main Street',     theme:'street',   goal:12, time:80, hgap:[340,560], aware:.40, gap:[440,780], flee:225,
    obs:['box','bench','bin','cone'], types:{walker:4,jogger:3,business:3,skater:0} },
  { name:'Boardwalk Beach', theme:'beach',    goal:15, time:85, hgap:[320,520], aware:.50, gap:[400,720], flee:250,
    obs:['box','bench','bin'], types:{walker:3,jogger:4,business:1,skater:2} },
  { name:'Downtown Rush',   theme:'downtown', goal:18, time:90, hgap:[290,480], aware:.65, gap:[360,640], flee:275,
    obs:['box','bench','bin','cone','crates'], types:{walker:2,jogger:3,business:4,skater:3} },
  { name:'Midnight Mayhem', theme:'night',    goal:22, time:95, hgap:[270,440], aware:.80, gap:[330,600], flee:300,
    obs:['box','bench','bin','crates'], types:{walker:2,jogger:4,business:3,skater:4} },
];

const DIFFS = {
  easy:   { label:'Easy',   lives:5, time:1.35, aware:.6, hspeed:.85, spawn:.85, gapMul:1.2,  score:1 },
  normal: { label:'Normal', lives:3, time:1.0,  aware:1,  hspeed:1,   spawn:1,   gapMul:1,    score:1.5 },
  hard:   { label:'Hard',   lives:2, time:.85,  aware:1.3,hspeed:1.15,spawn:1.1, gapMul:.85,  score:2 },
};

const OBS = { box:{w:54,h:50}, bench:{w:110,h:46}, bin:{w:46,h:66}, cone:{w:36,h:48}, crates:{w:58,h:94} };

const HTYPES = {
  walker:   { speed:[55,80],   ht:104, aw:.75, prefs:['aside','aside','flee'] },
  jogger:   { speed:[120,150], ht:108, aw:1,   prefs:['jump','flee','flee'] },
  business: { speed:[80,100],  ht:112, aw:.95, prefs:['flee','aside','jump'] },
  skater:   { speed:[160,200], ht:100, aw:1.1, prefs:['jump','jump','aside'] },
};

const SKINS  = ['#f6d3b3','#e8b88f','#c98e62','#9a6440','#6e4429','#f1c7a0'];
const SHIRTS = ['#e8524a','#3f7fd8','#f2b632','#51b36b','#a05ad8','#f07ab1','#2fb5b0','#ff8c42'];
const PANTS  = ['#2f4d7a','#3a3a46','#6b5a45','#1f6f6a','#5a3d6e','#454f5c'];
const HAIRS  = ['#2a1b12','#5a3a1e','#c9a24a','#1a1a1a','#a0431f','#8f8f8f'];
const DODGE_SAY = ['Eek!','Nope!','Not today!','Bad dog!','Shoo!','Good boy..?','Yikes!','No no no!'];
const OUCH_SAY  = ['OUCH!','MY LEG!','YOWCH!','HEY!!','AAAH!','RUDE!'];

const THEMES = {
  park:     { sky:['#79c3f0','#d9f1ff'], ground:'#d4b37a', top:'#6bbf4e', line:'rgba(90,60,20,.12)', sun:true, clouds:true },
  street:   { sky:['#8fc9ec','#f3e7d3'], ground:'#b4b4b8', top:'#8a8a90', line:'rgba(0,0,0,.12)', sun:true, clouds:true },
  beach:    { sky:['#ffb37a','#ffe6b8'], ground:'#f0d6a0', top:'#b07a4a', line:'rgba(120,70,20,.18)', sun:true, clouds:true },
  downtown: { sky:['#9fb6d6','#e6e9ef'], ground:'#8f96a3', top:'#6d7380', line:'rgba(0,0,0,.14)', sun:false, clouds:true },
  night:    { sky:['#0b1030','#33285a'], ground:'#3a3d4a', top:'#24262f', line:'rgba(255,255,255,.06)', sun:false, clouds:false, stars:true },
};

/* ---------- helpers ---------- */
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const hash = (i,s) => { const x = Math.sin(i*127.1 + s*311.7)*43758.5453; return x - Math.floor(x); };
function weighted(obj){
  let tot = 0; for (const k in obj) tot += obj[k];
  let r = Math.random()*tot;
  for (const k in obj){ r -= obj[k]; if (r <= 0) return k; }
  return Object.keys(obj)[0];
}

/* ---------- canvas ---------- */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
function resize(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width*dpr));
  cv.height = Math.max(1, Math.round(r.height*dpr));
}
addEventListener('resize', resize);
resize();

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function ell(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2); ctx.fill(); }

/* ---------- save ---------- */
const SAVE_KEY = 'biteclub.v1';
let save = { unlocked:{easy:1,normal:1,hard:1}, best:0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.unlocked) save = Object.assign(save, s); } catch(e){}
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){} }

/* ---------- audio ---------- */
let AC = null, muted = false;
function audio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur, o = {}){
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + (o.delay||0);
  const osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'square';
  osc.frequency.setValueAtTime(f, t);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f + o.slide), t + dur);
  g.gain.setValueAtTime(o.vol || .08, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  osc.connect(g).connect(a.destination);
  osc.start(t); osc.stop(t + dur + .02);
}
function noise(dur, vol = .15, freq = 1200){
  if (muted) return; const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate*dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  src.connect(f).connect(g).connect(a.destination); src.start();
}
const SFX = {
  jump:  () => tone(300,.18,{type:'sine',slide:420,vol:.12}),
  snap:  () => tone(760,.05,{type:'square',slide:-300,vol:.05}),
  chomp: () => { noise(.09,.3,900); tone(180,.12,{type:'square',slide:-90,vol:.1}); tone(560,.08,{type:'sawtooth',slide:-260,vol:.07,delay:.05}); },
  yelp:  () => tone(820,.18,{type:'triangle',slide:520,vol:.07,delay:.06}),
  hit:   () => { tone(220,.32,{type:'square',slide:-160,vol:.12}); noise(.18,.22,400); },
  bone:  () => { tone(660,.08,{type:'triangle',vol:.1}); tone(990,.14,{type:'triangle',vol:.1,delay:.07}); },
  land:  () => noise(.05,.08,300),
  win:   () => [523,659,784,1046].forEach((f,i)=>tone(f,.2,{type:'triangle',vol:.12,delay:i*.11})),
  lose:  () => [392,330,262,196].forEach((f,i)=>tone(f,.24,{type:'square',vol:.07,delay:i*.15})),
};

/* ---------- input ---------- */
const keys = {};
const touch = { left:false, right:false, sprint:false };
let jumpBuf = 0, biteBuf = 0;
const JUMP_KEYS = ['Space','ArrowUp','KeyW'], BITE_KEYS = ['KeyX','KeyJ'];
const down = (...c) => c.some(k => keys[k]);

addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyM') toggleMute();
  if (state === 'play'){
    if (JUMP_KEYS.includes(e.code)) jumpBuf = .14;
    if (BITE_KEYS.includes(e.code)) biteBuf = .14;
    if (e.code === 'KeyP' || e.code === 'Escape') pauseGame();
  } else if (state === 'paused'){
    if (e.code === 'KeyP' || e.code === 'Escape') resumeGame();
  } else if (state === 'menu' && e.code === 'Enter'){
    startRun();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') pauseGame(); });

document.querySelectorAll('#touch button').forEach(b => {
  const t = b.dataset.t;
  const on = e => { e.preventDefault(); b.classList.add('hot'); audio();
    if (t === 'jump') jumpBuf = .14; else if (t === 'bite') biteBuf = .14; else touch[t] = true; };
  const off = e => { e.preventDefault(); b.classList.remove('hot'); if (t in touch) touch[t] = false; };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
});
if (matchMedia('(pointer:coarse)').matches) document.getElementById('touch').classList.add('live');

/* ---------- game state ---------- */
let state = 'menu';      // menu | play | paused | result
let diff = 'normal';
let selLevel = 0;
let runStart = 0;        // score at start of current level
let G = null;
let menuT = 0;

function makeDog(x){
  return { x, y:0, vx:0, vy:0, onGround:true, bite:0, biteCd:0, biteHit:false,
           inv:0, hurt:0, stamina:100, tired:false, gp:0, sprinting:false };
}

function startLevel(i){
  const L = LEVELS[i], D = DIFFS[diff];
  G = {
    i, L, D, t:0, score:runStart, timeLeft:Math.round(L.time*D.time), bites:0, combo:0, comboT:0, maxCombo:0,
    lives:D.lives, dog:makeDog(140), cam:0, humans:[], obs:[], bones:[], parts:[], texts:[],
    nextObsX:820, nextBoneX:1150, humanDist:0, humanT:0, nextHumanGap:220,
    endType:null, end:0, reason:'', shake:0, banner:3.2, escaped:0, flash:0,
  };
  jumpBuf = biteBuf = 0;
  hideAll();
  state = 'play';
  if (document.activeElement) document.activeElement.blur();
  audio();
}

function startRun(){ runStart = 0; startLevel(selLevel); }

/* ---------- spawning ---------- */
function spawnObstacles(){
  const g = G;
  while (g.nextObsX < g.cam + W + 160){
    const type = pick(g.L.obs), O = OBS[type];
    g.obs.push({ type, x:g.nextObsX, w:O.w, h:O.h, inside:false });
    g.nextObsX += O.w + Math.max(270, rand(g.L.gap[0], g.L.gap[1])*g.D.gapMul);
  }
}
function spawnBones(){
  const g = G;
  while (g.nextBoneX < g.cam + W + 120){
    let x = g.nextBoneX;
    for (const o of g.obs) if (x > o.x - 40 && x < o.x + o.w + 40) x = o.x + o.w + 90;
    g.bones.push({ x, y: Math.random() < .5 ? 26 : 128, got:false });
    g.nextBoneX = x + rand(900, 1500);
  }
}
function spawnHuman(){
  const g = G, type = weighted(g.L.types), T = HTYPES[type];
  g.humans.push({
    type, x:g.cam + W + 60, y:0, vy:0, state:'walk', lane:0,
    speed: rand(T.speed[0], T.speed[1])*g.D.hspeed, ht: T.ht*rand(.94,1.06),
    react: rand(170,250) + g.L.aware*90,
    aw: Math.min(.92, g.L.aware*g.D.aware*T.aw), prefs:T.prefs,
    decided:false, cool:0, plan:null, asideT:0, fleeT:0, fleeSpeed:0, dodges:0,
    phase: Math.random(), look: makeLook(type),
    escaped:false, say:null, sayT:0, scared:0,
  });
}

/* ---------- effects ---------- */
function burst(x, y, n, cols, sp = 220, grav = 900){
  for (let i=0;i<n;i++){
    const a = rand(0, Math.PI*2), s = rand(sp*.3, sp);
    G.parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - sp*.4, g:grav, life:rand(.4,.8), max:.8, col:pick(cols), r:rand(2,5) });
  }
}
function dust(x, n = 6){
  for (let i=0;i<n;i++) G.parts.push({ x:x+rand(-10,10), y:GROUND-2, vx:rand(-90,30), vy:rand(-90,-20), g:200, life:rand(.25,.5), max:.5, col:'rgba(160,130,90,.6)', r:rand(3,6) });
}
function floatText(x, y, text, col = '#fff', size = 22){
  G.texts.push({ x, y, text, col, size, life:1.1 });
}

/* ---------- update ---------- */
function endLevel(type, reason){
  const g = G; if (g.endType) return;
  g.endType = type; g.reason = reason; g.end = type === 'win' ? 1.4 : 1.6;
  if (type === 'win') SFX.win(); else SFX.lose();
}

function hurtDog(){
  const g = G, d = g.dog;
  g.lives--; d.inv = 1.6; d.hurt = .35; d.vx = -260; d.vy = 380; d.onGround = false;
  g.shake = 12; g.flash = .25;
  if (g.combo > 1) floatText(d.x + 40*DOG_S, GROUND - d.y - 90*DOG_S - 15, 'Combo lost', '#ffd9d0', 18);
  g.combo = 0;
  SFX.hit();
  burst(d.x + 70*DOG_S, GROUND - d.y - 40*DOG_S, 10, ['#fff','#ffd23d','#ff8c42'], 200);
  floatText(d.x + 40*DOG_S, GROUND - d.y - 70*DOG_S - 10, 'BONK!', '#ffe14d', 26);
  if (g.lives <= 0) endLevel('lose', 'Out of lives!');
}

function biteHuman(h){
  const g = G, d = g.dog;
  const wasFleeing = h.state === 'flee', wasAir = h.y > 20, dogAir = d.y > 20;
  h.state = 'bitten'; h.vy = 420; h.say = pick(OUCH_SAY); h.sayT = 1.2; h.lane = 0;
  g.bites++; g.combo++; g.comboT = 5; g.maxCombo = Math.max(g.maxCombo, g.combo);
  const mult = Math.min(4, 1 + (g.combo - 1)*.5);
  let bonus = 0, tag = null;
  if (wasAir){ bonus += 75; tag = 'SKY SNACK!'; }
  else if (dogAir){ bonus += 75; tag = 'AIR BITE!'; }
  if (wasFleeing){ bonus += 50; tag = tag || 'RUNNER!'; }
  if (d.sprinting){ bonus += 25; }
  const pts = Math.round((100 + bonus)*mult*g.D.score);
  g.score += pts;
  g.shake = 6;
  SFX.chomp(); SFX.yelp();
  const hy = GROUND - h.y - 60;
  burst(h.x, hy, 14, ['#fff','#ffe14d','#ff6b3d'], 260);
  floatText(h.x, hy - 30, '+' + pts, '#fff', 26);
  if (tag) floatText(h.x, hy - 58, tag, '#ffe14d', 18);
  if (g.combo > 1) floatText(h.x, hy - (tag ? 82 : 58), 'COMBO x' + mult.toFixed(1).replace('.0',''), '#7ef0ff', 18);
  if (g.bites >= g.L.goal) endLevel('win', 'Level clear!');
}

function update(dt){
  const g = G, d = g.dog, L = g.L, D = g.D;
  g.t += dt;
  if (g.banner > 0) g.banner -= dt;
  if (g.flash > 0) g.flash -= dt;
  jumpBuf = Math.max(0, jumpBuf - dt);
  biteBuf = Math.max(0, biteBuf - dt);

  if (!g.endType){
    g.timeLeft -= dt;
    if (g.timeLeft <= 0){ g.timeLeft = 0; endLevel('lose', "Time's up!"); }
  } else {
    g.end -= dt;
    if (g.end <= 0){ finishLevel(); return; }
  }
  const alive = g.endType !== 'lose';

  /* --- dog control --- */
  const right = alive && (down('ArrowRight','KeyD') || touch.right || touch.sprint);
  const left  = alive && (down('ArrowLeft','KeyA') || touch.left);
  const wantSprint = down('ShiftLeft','ShiftRight','KeyK') || touch.sprint;
  const sprint = alive && wantSprint && right && !d.tired && d.stamina > 0 && d.hurt <= 0;
  if (sprint){
    d.stamina -= 34*dt;
    if (d.stamina <= 0){ d.stamina = 0; d.tired = true; }
  } else {
    d.stamina = Math.min(100, d.stamina + (d.tired ? 14 : 20)*dt);
    if (d.tired && d.stamina >= 30) d.tired = false;
  }
  d.sprinting = sprint;

  let target = right ? (sprint ? 460 : 270) : left ? -180 : 0;
  if (d.hurt > 0){ d.hurt -= dt; target = d.vx; }
  const acc = d.onGround ? 1500 : 700;
  d.vx += clamp(target - d.vx, -acc*dt, acc*dt);

  if (alive && jumpBuf > 0 && d.onGround && d.hurt <= 0){
    d.vy = 760; d.onGround = false; jumpBuf = 0;
    SFX.jump(); dust(d.x + 30*DOG_S, 5);
  }
  d.biteCd -= dt;
  if (alive && biteBuf > 0 && d.biteCd <= 0){
    d.bite = BITE_TIME; d.biteCd = BITE_CD; d.biteHit = false; biteBuf = 0;
    SFX.snap();
  }
  if (d.bite > 0) d.bite -= dt;
  if (d.inv > 0) d.inv -= dt;

  /* --- dog physics --- */
  const prevY = d.y, prevX = d.x;
  d.x += (d.vx + (d.bite > .08 ? 150 : 0))*dt;
  if (d.x < g.cam + 16){ d.x = g.cam + 16; if (d.vx < 0) d.vx = 0; }
  d.vy -= GRAV*dt;
  d.y += d.vy*dt;

  let floor = 0;
  for (const o of g.obs){
    if (d.x + DOG_X2 > o.x + 4 && d.x + DOG_X1 < o.x + o.w - 4 && prevY >= o.h - 3) floor = Math.max(floor, o.h);
  }
  if (d.y <= floor){
    if (!d.onGround && prevY > floor + 8){ SFX.land(); dust(d.x + 40*DOG_S, 4); }
    d.y = floor; d.vy = 0; d.onGround = true;
  } else d.onGround = false;

  // side collisions
  for (const o of g.obs){
    const inside = d.x + DOG_X2 > o.x + 4 && d.x + DOG_X1 < o.x + o.w - 4 && d.y < o.h - 6;
    if (inside && !o.inside && d.inv <= 0 && alive) hurtDog();
    o.inside = inside;
  }

  dogGait(d, dt);
  if (d.onGround && d.sprinting && Math.random() < .5) dust(d.x + 10*DOG_S, 1);

  /* --- camera & world --- */
  const dx = Math.max(0, d.x - prevX);
  const camTarget = d.x - 260;
  if (camTarget > g.cam) g.cam += (camTarget - g.cam)*Math.min(1, dt*8);
  spawnObstacles(); spawnBones();

  g.humanDist += dx; g.humanT += dt;
  if (!g.endType && (g.humanDist >= g.nextHumanGap || g.humanT >= 3.4*D.spawn)){
    spawnHuman();
    g.humanDist = 0; g.humanT = 0;
    g.nextHumanGap = rand(L.hgap[0], L.hgap[1])*D.spawn;
  }

  /* --- bite check --- */
  if (d.bite > .06 && !d.biteHit && alive){
    const bx1 = d.x + 56*DOG_S, bx2 = d.x + 112*DOG_S, by1 = d.y + 6*DOG_S, by2 = d.y + 52*DOG_S;
    for (const h of g.humans){
      if (h.state === 'bitten' || h.lane > .35) continue;
      if (bx2 > h.x - 18 && bx1 < h.x + 18 && by2 > h.y && by1 < h.y + h.ht){
        d.biteHit = true; biteHuman(h); break;
      }
    }
  }

  /* --- humans --- */
  for (const h of g.humans){
    h.sayT -= dt; if (h.scared > 0) h.scared -= dt;
    if (h.cool > 0) h.cool -= dt;
    const gap = (h.x - 18) - (d.x + 90*DOG_S);   // human front to dog snout

    if (h.state === 'bitten'){
      h.x += 430*dt; h.phase += dt*430/(.98*h.ht);
    } else if (h.state === 'walk'){
      h.x -= h.speed*dt; h.phase += h.type === 'skater' ? dt*.9 : dt*h.speed/((h.speed > 110 ? .98 : .457)*h.ht);
      if (!h.decided && h.cool <= 0 && gap > -10 && gap < h.react && !g.endType){
        h.decided = true;
        if (Math.random() < h.aw*Math.pow(.55, h.dodges)){
          const p = pick(h.prefs);
          h.say = pick(DODGE_SAY); h.sayT = 1; h.scared = .8;
          if (p === 'jump') h.plan = 'jump';
          else if (p === 'flee'){ h.state = 'flee'; h.fleeT = rand(1.4,2.4); h.fleeSpeed = L.flee*D.hspeed*rand(.9,1.1); }
          else { h.state = 'aside'; h.asideT = rand(1,1.5); }
        }
      }
      if (h.plan === 'jump' && h.y === 0 && (gap < 55 || (d.bite > 0 && gap < 100))){
        h.vy = h.type === 'skater' ? 720 : 640; h.plan = null;
      }
    } else if (h.state === 'flee'){
      h.x += h.fleeSpeed*dt; h.phase += h.type === 'skater' ? dt*1.4 : dt*h.fleeSpeed/(.98*h.ht); h.fleeT -= dt;
      if (h.fleeT <= 0){ h.state = 'walk'; h.cool = .8; h.decided = false; h.dodges++; }
    } else if (h.state === 'aside'){
      h.asideT -= dt;
      if (h.asideT <= 0){ h.state = 'walk'; h.cool = .8; h.decided = false; h.dodges++; }
    }
    const laneTarget = h.state === 'aside' ? 1 : 0;
    h.lane += (laneTarget - h.lane)*Math.min(1, dt*9);

    // hop over obstacles
    if (h.y === 0 && h.lane < .2 && (h.state === 'walk' || h.state === 'flee')){
      for (const o of g.obs){
        const og = h.state === 'walk' ? (h.x - 16) - (o.x + o.w) : o.x - (h.x + 16);
        if (og > 0 && og < 22){ h.vy = 560; break; }
      }
    }
    if (h.y > 0 || h.vy > 0){
      h.vy -= HGRAV*dt; h.y += h.vy*dt;
      if (h.y <= 0){ h.y = 0; h.vy = 0; }
    }
    if (!h.escaped && h.state !== 'bitten' && h.x < d.x - 10){
      h.escaped = true; g.escaped++;
      if (g.combo > 1) floatText(d.x + 20, GROUND - 70, 'Combo lost', '#ffd9d0', 16);
      g.combo = 0;
    }
  }
  g.humans = g.humans.filter(h => h.x > g.cam - 140 && h.x < g.cam + W + 700);

  /* --- bones --- */
  for (const b of g.bones){
    if (b.got) continue;
    if (d.x + DOG_X1 < b.x + 16 && d.x + 96*DOG_S > b.x - 16 && d.y < b.y + 12 && d.y + 56*DOG_S > b.y - 12){
      b.got = true;
      d.stamina = Math.min(100, d.stamina + 40); d.tired = false;
      const pts = Math.round(25*D.score);
      g.score += pts;
      SFX.bone();
      floatText(b.x, GROUND - b.y - 20, '+' + pts + ' ⚡', '#fff6a8', 18);
      burst(b.x, GROUND - b.y, 8, ['#fff','#fff6a8'], 160, 600);
    }
  }
  g.bones = g.bones.filter(b => !b.got && b.x > g.cam - 60);
  g.obs = g.obs.filter(o => o.x + o.w > g.cam - 60);

  /* --- combo, fx --- */
  if (g.comboT > 0){ g.comboT -= dt; if (g.comboT <= 0) g.combo = 0; }
  if (g.shake > 0) g.shake = Math.max(0, g.shake - dt*40);
  for (const p of g.parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.g*dt; p.life -= dt; }
  g.parts = g.parts.filter(p => p.life > 0);
  for (const t of g.texts){ t.y -= 40*dt; t.life -= dt; }
  g.texts = g.texts.filter(t => t.life > 0);
}

/* ---------- drawing: background ---------- */
function layer(par, spacing, cam, fn){
  const off = cam*par;
  const s = Math.floor(off/spacing) - 1, e = Math.ceil((off + W)/spacing) + 1;
  for (let i = s; i <= e; i++) fn(i*spacing - off, i);
}
function cloud(x, y, s){
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ell(x, y, 40*s, 16*s); ell(x - 26*s, y + 4*s, 24*s, 12*s); ell(x + 28*s, y + 3*s, 26*s, 12*s); ell(x + 4*s, y - 12*s, 24*s, 14*s);
}
function buildings(cam, par, spacing, seed, minH, maxH, cols, winOn, winOff, lit, base){
  layer(par, spacing, cam, (x, i) => {
    const w = spacing*(.62 + hash(i,seed)*.3), h = minH + hash(i,seed+1)*(maxH - minH);
    const bx = x + hash(i,seed+3)*(spacing - w);
    ctx.fillStyle = cols[Math.floor(hash(i,seed+2)*cols.length)];
    ctx.fillRect(bx, base - h, w, h);
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(bx, base - h, w, 6);
    const nc = Math.floor((w - 10)/17), nr = Math.floor((h - 22)/24);
    for (let r = 0; r < nr; r++) for (let c = 0; c < nc; c++){
      ctx.fillStyle = hash(i*37 + r*7 + c*13, seed + 4) < lit ? winOn : winOff;
      ctx.fillRect(bx + 8 + c*17, base - h + 14 + r*24, 9, 13);
    }
  });
}
function tree(x, base, s, k){
  ctx.fillStyle = '#7a4f2a'; ctx.fillRect(x - 5*s, base - 60*s, 10*s, 60*s);
  ctx.fillStyle = k ? '#3f9a47' : '#4fae55';
  circ(x, base - 78*s, 32*s); circ(x - 22*s, base - 62*s, 22*s); circ(x + 22*s, base - 62*s, 22*s);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; circ(x - 10*s, base - 92*s, 12*s);
}
function lamp(x, base, glow){
  ctx.fillStyle = '#3b3f4a'; ctx.fillRect(x - 3, base - 150, 6, 150); ctx.fillRect(x - 3, base - 150, 26, 5);
  ctx.fillStyle = glow ? '#ffe9a8' : '#cfd6df'; ctx.fillRect(x + 14, base - 146, 14, 8);
  if (glow){
    const gr = ctx.createRadialGradient(x + 21, base - 138, 2, x + 21, base - 138, 90);
    gr.addColorStop(0, 'rgba(255,225,140,.45)'); gr.addColorStop(1, 'rgba(255,225,140,0)');
    ctx.fillStyle = gr; circ(x + 21, base - 138, 90);
  }
}
function palm(x, base, s){
  ctx.strokeStyle = '#8a5a2e'; ctx.lineWidth = 9*s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, base); ctx.quadraticCurveTo(x + 18*s, base - 80*s, x + 6*s, base - 150*s); ctx.stroke();
  ctx.fillStyle = '#2f9a5a';
  const tx = x + 6*s, ty = base - 150*s;
  for (let k = 0; k < 6; k++){
    const a = -Math.PI/2 + (k - 2.5)*.55;
    ctx.save(); ctx.translate(tx, ty); ctx.rotate(a + Math.PI/2);
    ell(0, -34*s, 10*s, 36*s); ctx.restore();
  }
  ctx.fillStyle = '#6b4423'; circ(tx - 5*s, ty + 6*s, 5*s); circ(tx + 5*s, ty + 7*s, 5*s);
}

function drawBG(th, cam, t){
  const T = THEMES[th];
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, GROUND + 20);

  if (T.stars){
    for (let i = 0; i < 80; i++){
      ctx.globalAlpha = .4 + .6*Math.abs(Math.sin(t*1.5 + i));
      ctx.fillStyle = '#fff'; circ(hash(i,1)*W, hash(i,2)*280, hash(i,3)*1.4 + .4);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff4c9'; circ(790, 90, 34); ctx.fillStyle = '#33285a'; circ(806, 80, 30);
  }
  if (T.sun){
    const sy = th === 'beach' ? 250 : 90, sx = th === 'beach' ? 640 : 820;
    const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 110);
    sg.addColorStop(0, 'rgba(255,240,170,.9)'); sg.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = sg; circ(sx, sy, 110);
    ctx.fillStyle = th === 'beach' ? '#ffdf6e' : '#fff3b0'; circ(sx, sy, 38);
  }
  if (T.clouds){
    layer(.06, 300, cam + t*40, (x, i) => cloud(x + hash(i,5)*90, 50 + hash(i,6)*90, .7 + hash(i,7)*.6));
  }

  switch (th){
    case 'park': {
      const hill = (par, base, amp, col, k) => {
        ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, GROUND);
        const off = cam*par;
        for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, base - amp*Math.sin((x + off)*.006 + k) - amp*.5*Math.sin((x + off)*.013 + k*2));
        ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
      };
      hill(.12, 330, 40, '#9fd88a', 0);
      hill(.25, 375, 28, '#7cc66a', 2);
      layer(.5, 240, cam, (x, i) => tree(x + hash(i,8)*70, GROUND, .8 + hash(i,9)*.5, hash(i,10) > .5));
      break;
    }
    case 'street':
      buildings(cam, .18, 150, 11, 140, 250, ['#e8c7a8','#d7b8d6','#b9d3e6','#f0d9a6'], '#fff7d6', 'rgba(60,80,110,.35)', .25, GROUND);
      buildings(cam, .38, 190, 21, 120, 210, ['#c46b4e','#a65a48','#d08a5c','#8b6c5c'], '#ffe9b0', 'rgba(40,50,70,.45)', .2, GROUND);
      layer(.85, 360, cam, (x) => lamp(x, GROUND, false));
      break;
    case 'beach': {
      const sg = ctx.createLinearGradient(0, 300, 0, GROUND);
      sg.addColorStop(0, '#3fa3c9'); sg.addColorStop(1, '#7fd0dd');
      ctx.fillStyle = sg; ctx.fillRect(-20, 300, W + 40, GROUND - 300);
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
      for (let r = 0; r < 5; r++){
        const yy = 318 + r*28, off = (cam*(.1 + r*.05) + t*20*(r % 2 ? 1 : -1)) % 80;
        for (let x = -80 - off; x < W + 80; x += 80){ ctx.beginPath(); ctx.moveTo(x, yy); ctx.quadraticCurveTo(x + 20, yy - 5, x + 40, yy); ctx.stroke(); }
      }
      ctx.fillStyle = '#e9c98a'; ctx.fillRect(-20, GROUND - 26, W + 40, 26);
      layer(.55, 320, cam, (x, i) => palm(x + hash(i,12)*100, GROUND - 10, .8 + hash(i,13)*.4));
      break;
    }
    case 'downtown':
      buildings(cam, .1, 130, 31, 240, 380, ['#a9b7cc','#9aa9c0','#b8c4d6'], 'rgba(255,255,255,.55)', 'rgba(60,80,120,.25)', .4, GROUND);
      buildings(cam, .3, 170, 41, 160, 290, ['#6f7d94','#5d6a80','#7b879c','#4f5a6e'], '#dfe9f7', 'rgba(20,30,50,.4)', .3, GROUND);
      layer(.85, 330, cam, (x) => lamp(x, GROUND, false));
      break;
    case 'night':
      buildings(cam, .12, 140, 51, 200, 340, ['#1c2140','#232850','#1a1d38'], '#ffd56b', 'rgba(255,255,255,.05)', .35, GROUND);
      buildings(cam, .32, 180, 61, 140, 260, ['#2a2f4f','#2f2a4a','#25293f'], '#ffcf5c', 'rgba(255,255,255,.04)', .4, GROUND);
      layer(.85, 340, cam, (x) => lamp(x, GROUND, true));
      break;
  }

  // ground
  ctx.fillStyle = T.ground; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  ctx.fillStyle = T.top; ctx.fillRect(-20, GROUND, W + 40, 10);
  ctx.strokeStyle = T.line; ctx.lineWidth = 3;
  const off = cam % 64;
  for (let x = -off - 64; x < W + 64; x += 64){
    ctx.beginPath(); ctx.moveTo(x, GROUND + 10); ctx.lineTo(x - 24, H + 20); ctx.stroke();
  }
  if (th === 'park'){ ctx.fillStyle = '#5aa53f'; for (let x = -(cam % 18) - 18; x < W + 18; x += 18){ ctx.beginPath(); ctx.moveTo(x, GROUND + 10); ctx.lineTo(x + 5, GROUND + 1); ctx.lineTo(x + 10, GROUND + 10); ctx.fill(); } }
}

/* ---------- drawing: obstacles, bones ---------- */
function drawObstacle(o, cam){
  const x = Math.round(o.x - cam), b = GROUND;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ell(x + o.w/2, b + 3, o.w/2 + 4, 5);
  const crate = (cx, cy, w, h) => {
    ctx.fillStyle = '#c98d4c'; ctx.fillRect(cx, cy, w, h);
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 4; ctx.strokeRect(cx + 2, cy + 2, w - 4, h - 4);
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx + 4, cy + 4); ctx.lineTo(cx + w - 4, cy + h - 4); ctx.moveTo(cx + w - 4, cy + 4); ctx.lineTo(cx + 4, cy + h - 4); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(cx + 4, cy + 4, w - 8, 4);
  };
  switch (o.type){
    case 'box': crate(x, b - o.h, o.w, o.h); break;
    case 'crates': crate(x, b - 48, o.w, 48); crate(x + 5, b - o.h, o.w - 10, 46); break;
    case 'bench':
      ctx.fillStyle = '#2f3540';
      ctx.fillRect(x + 10, b - o.h + 8, 7, o.h - 8); ctx.fillRect(x + o.w - 17, b - o.h + 8, 7, o.h - 8);
      ctx.fillRect(x + 6, b - 6, 15, 6); ctx.fillRect(x + o.w - 21, b - 6, 15, 6);
      ctx.fillStyle = '#3f8f4f'; rr(x, b - o.h, o.w, 12, 4); ctx.fill();
      ctx.fillStyle = '#2f7a40'; for (let k = 1; k < 5; k++) ctx.fillRect(x + k*o.w/5, b - o.h, 2, 12);
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + 3, b - o.h + 2, o.w - 6, 3);
      break;
    case 'bin':
      ctx.fillStyle = '#7d8b96';
      ctx.beginPath(); ctx.moveTo(x + 4, b - o.h + 10); ctx.lineTo(x + o.w - 4, b - o.h + 10); ctx.lineTo(x + o.w - 8, b); ctx.lineTo(x + 8, b); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#5f6b75'; ctx.lineWidth = 3;
      for (let k = 1; k < 4; k++){ const xx = x + k*o.w/4; ctx.beginPath(); ctx.moveTo(xx, b - o.h + 16); ctx.lineTo(xx + (k - 2)*-1.5, b - 6); ctx.stroke(); }
      ctx.fillStyle = '#5f6b75'; rr(x, b - o.h, o.w, 12, 5); ctx.fill();
      ctx.fillRect(x + o.w/2 - 8, b - o.h - 5, 16, 6);
      ctx.fillStyle = '#ffe15a'; ctx.fillRect(x + o.w - 12, b - o.h - 2, 10, 4); // banana peel peek
      break;
    case 'cone':
      ctx.fillStyle = '#ff7a1f';
      ctx.beginPath(); ctx.moveTo(x + o.w/2, b - o.h); ctx.lineTo(x + o.w - 6, b - 6); ctx.lineTo(x + 6, b - 6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(x + 13, b - 32, o.w - 26, 6); ctx.fillRect(x + 10, b - 20, o.w - 20, 6);
      ctx.fillStyle = '#e0601a'; ctx.fillRect(x, b - 7, o.w, 7);
      break;
  }
}
function drawBone(b, cam, t){
  const x = b.x - cam, y = GROUND - b.y + Math.sin(t*4 + b.x)*4;
  ctx.save(); ctx.translate(x, y); ctx.rotate(-.35);
  ctx.fillStyle = 'rgba(255,255,200,.35)'; circ(0, 0, 20);
  ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#c9b48f'; ctx.lineWidth = 2;

/* ---------- skeletal animation helpers ---------- */
const lerp = (a,b,t) => a + (b - a)*t;
const smooth = t => t*t*(3 - 2*t);
// 2-bone inverse kinematics. bend = -1 puts the joint in front (+x), +1 behind.
function ik(bx, by, tx, ty, l1, l2, bend){
  let dx = tx - bx, dy = ty - by, d = Math.hypot(dx, dy) || .001;
  const maxd = l1 + l2 - .01;
  if (d > maxd){ tx = bx + dx/d*maxd; ty = by + dy/d*maxd; dx = tx - bx; dy = ty - by; d = maxd; }
  const a = Math.atan2(dy, dx);
  const c = clamp((l1*l1 + d*d - l2*l2)/(2*l1*d), -1, 1);
  const ang = a + bend*Math.acos(c);
  return [bx + Math.cos(ang)*l1, by + Math.sin(ang)*l1, tx, ty];
}
// tapered capsule limb segment
function seg(x1, y1, x2, y2, w1, w2, col){
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || .001, nx = -dy/L, ny = dx/L;
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x1 + nx*w1/2, y1 + ny*w1/2); ctx.lineTo(x2 + nx*w2/2, y2 + ny*w2/2);
  ctx.lineTo(x2 - nx*w2/2, y2 - ny*w2/2); ctx.lineTo(x1 - nx*w1/2, y1 - ny*w1/2);
  ctx.closePath(); ctx.fill();
  circ(x1, y1, w1/2); circ(x2, y2, w2/2);
}
// foot path for a gait cycle: stance = planted & sliding back linearly (matches ground speed), swing = arc forward
function footPos(p, duty, R, lift){
  p = ((p % 1) + 1) % 1;
  if (p < duty){ const t = p/duty; return { x: R - 2*R*t, y: 0, st: true, t }; }
  const t = (p - duty)/(1 - duty);
  return { x: -R + 2*R*smooth(t), y: lift*Math.sin(Math.PI*t), st: false, t };
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

/* ---------- drawing: dog (German Shepherd-style, skeletal) ---------- */
const DOGC = { tan:'#c8894a', tanL:'#dcaa6c', saddle:'#2b2019', leg1:'#c58646', leg2:'#d39a5a',

function dogGaitParams(v){
  if (v >= 150){
    const k = clamp((v - 150)/310, 0, 1);
    return { gallop:true, duty:lerp(.42,.3,k), R:lerp(17,24,k), lift:lerp(11,15,k), offs:{HL:0, HR:.1, FR:.45, FL:.55} };
  }
  return { gallop:false, duty:.65, R:12, lift:7, offs:{HL:0, FL:.25, HR:.5, FR:.75} };
}
function dogGait(d, dt){
  const v = Math.abs(d.vx);

    d.gp += dt*(v*g.duty/(2*g.R))*(d.vx < 0 ? -1 : 1);

}

const SHOES = ['#2a2a2a','#f2f2f2','#7a4a2a','#3b3b46','#8a8f99'];

  L.hairStyle = f ? pick(['long','ponytail','bun','bob','curly']) : pick(['short','short','bald','curly','buzz']);
  L.beard = !f && Math.random() < .28;

    L.top = 'suit'; L.topCol = pick(['#2c3550','#3a3a3f','#4a3b30','#24303a']);
    L.bottom = f && Math.random() < .5 ? 'skirt' : 'pants'; L.botCol = L.topCol;
    L.shoe = '#1a1a1a'; L.tie = pick(['#b33a3a','#3a6db3','#6a3ab3','#2f7a4f']);

    ctx.fillStyle = shade(lk.hatCol, -25); ctx.fillRect(-7.7*u, -11.6*u, 14.6*u, 2.4*u);

    ctx.fillStyle = lk.hatCol; ctx.beginPath(); ctx.ellipse(0, -11*u, 7*u, 5.2*u, 0, Math.PI, Math.PI*2); ctx.fill();
    ctx.fillStyle = shade(lk.hatCol, -25); ctx.fillRect(3*u, -11.6*u, 7.5*u, 1.5*u);
  }
  if (lk.band){
    ctx.fillStyle = lk.band; ctx.save(); ctx.translate(0, -11.6*u); ctx.rotate(-.12);
    ctx.fillRect(-6.9*u, -1*u, 13.4*u, 2.1*u); ctx.restore();
  }
}

function drawHuman(h, cam, t){
  const lk = h.look, ht = h.ht;
  const sx = h.x - cam, laneOff = h.lane*30, sc = 1 - h.lane*.15;
  const groundY = GROUND - laneOff;
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ell(sx, groundY + 2, ht*.17*sc*(h.y > 0 ? Math.max(.4, 1 - h.y/150) : 1), 4*sc);
  const face = (h.state === 'flee' || h.state === 'bitten') ? 1 : -1;
  ctx.save();
  ctx.translate(sx, groundY - h.y);
  ctx.scale(sc*face, sc);
  if (h.lane > .01) ctx.globalAlpha = 1 - h.lane*.3;

  // body proportions (real-ish: ~7.5 heads tall)
  const Lg = ht*.49, thL = Lg*.51, shL = Lg*.49, ankH = ht*.035, footL = ht*.105;
  const torsoL = ht*.29, neckL = ht*.035, headH = ht*.13, uArmL = ht*.165, fArmL = ht*.14;
  const skate = h.type === 'skater', lift = skate ? 9 : 0, air = h.y > 0;
  const spd = h.state === 'bitten' ? 430 : h.state === 'flee' ? h.fleeSpeed : h.state === 'walk' ? h.speed : 0;
  const run = spd > 110;
  const scared = h.scared > 0 || h.state === 'aside' || h.state === 'bitten' || h.state === 'flee';
  const P = h.phase;
  let fN, fF, pel, lean, aN, eN, aF, eF;

  if (skate){
    pel = ankH + Lg*.86; lean = .1;
    fN = { x:Lg*.2, y:0, ang:0 };
    const tp = ((P % 1) + 1) % 1;
    if (tp < .4 && !air && h.state !== 'aside'){
      const s = Math.sin(Math.PI*tp/.4);
      fF = { x:-Lg*.15 - Lg*.35*s, y:-lift*s, ang:.2*s };
    } else fF = { x:-Lg*.16, y:0, ang:0 };
    aN = .5; eN = .6; aF = -.5; eF = .5;
    if (scared){ aN = 2.2; eN = .9; aF = 1.9; eF = 1; }
  } else if (air){
    pel = ankH + Lg*.86; lean = .05;
    fN = { x:Lg*.32, y:Lg*.35, ang:.3 }; fF = { x:-Lg*.18, y:Lg*.3, ang:.5 };
    aN = 2.4; eN = .5; aF = 2.1; eF = .6;
  } else if (spd > 0){
    const R = (run ? .38 : .28)*Lg, duty = run ? .38 : .6, lf = (run ? .34 : .1)*Lg;
    const conv = g => {
      let y = g.y, ang;
      if (g.st){ const hr = Math.max(0, -g.x/R - .45)/.55; y = hr*footL*.32; ang = hr*.55; }
      else ang = lerp(run ? .9 : .45, -.12, smooth(g.t));
      return { x:g.x, y, ang, nx:g.x/R };
    };
    fN = conv(footPos(P, duty, R, lf)); fF = conv(footPos(P + .5, duty, R, lf));
    pel = ankH + Lg*(run ? (.885 - .035*Math.cos(4*Math.PI*(P - duty/2))) : (.955 + .022*Math.cos(4*Math.PI*(P - .3))));
    lean = run ? (h.state === 'walk' ? .16 : .24) : .04;
    const A = run ? .8 : (h.type === 'business' ? .22 : .38);
    aN = -A*fN.nx; aF = -A*fF.nx;
    eN = run ? 1.45 + .25*fN.nx : .2 + .35*Math.max(0, aN/A);
    eF = run ? 1.45 + .25*fF.nx : .2 + .35*Math.max(0, aF/A);
    if (h.state === 'bitten'){ aN = -.7; eN = 2.1; aF = 2.6 + .4*Math.sin(P*Math.PI*4); eF = .3; }
    else if (h.state === 'flee' && h.scared > 0){ aF = 2.5; eF = .4; }
  } else {
    // stepped aside: standing, leaning back, hands up
    pel = ankH + Lg*(.975 + Math.sin(t*3)*.008); lean = -.07;
    fN = { x:Lg*.12, y:0, ang:0 }; fF = { x:-Lg*.1, y:0, ang:0 };
    aN = 2.3; eN = 1.0; aF = 2.0; eF = 1.1;
  }

  const hipX = 0, hipY = -(pel + lift);
  const sl = Math.sin(lean), cl = Math.cos(lean);
  const shX = hipX + sl*torsoL, shY = hipY - cl*torsoL;
  const legPts = f => {
    const [kx, ky, ax, ay] = ik(hipX, hipY, f.x, -(lift + ankH + f.y), thL, shL, -1);
    return { kx, ky, ax, ay, ang:f.ang };
  };
  const LN = legPts(fN), LF = legPts(fF);
  const skin = lk.skin, skinD = shade(skin, -28), top = lk.topCol, topD = shade(top, -35), bot = lk.botCol, botD = shade(bot, -30);

  const drawShoe = (x, y, a, col) => {
    const ux = Math.cos(a), uy = Math.sin(a), vx = -Math.sin(a), vy = Math.cos(a);
    const Pp = (s, q) => [x + ux*s + vx*q, y + uy*s + vy*q];
    const pts = [Pp(-footL*.28, -ankH*.4), Pp(-footL*.3, ankH*1.05), Pp(footL*.78, ankH*1.05), Pp(footL*.86, ankH*.35), Pp(footL*.4, -ankH*.6)];
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fill();
  };
  const drawLeg = (L, far) => {
    const cB = far ? botD : bot, cS = far ? skinD : skin;
    const wT1 = ht*.085, wT2 = ht*.062, wS1 = ht*.06, wS2 = ht*.042;
    if (lk.bottom === 'pants'){
      seg(hipX, hipY, L.kx, L.ky, wT1, wT2, cB); seg(L.kx, L.ky, L.ax, L.ay, wS1, wS2, cB);
    } else if (lk.bottom === 'shorts'){
      seg(hipX, hipY, L.kx, L.ky, wT1*.95, wT2, cS);
      seg(hipX, hipY, lerp(hipX, L.kx, .65), lerp(hipY, L.ky, .65), wT1*1.08, wT2*1.18, cB);
      seg(L.kx, L.ky, L.ax, L.ay, wS1*.95, wS2, cS);
    } else {
      seg(hipX, hipY, L.kx, L.ky, wT1*.9, wT2*.9, cS); seg(L.kx, L.ky, L.ax, L.ay, wS1*.92, wS2, cS);
    }
    drawShoe(L.ax, L.ay, L.ang, far ? shade(lk.shoe, -35) : lk.shoe);
  };
  const drawArm = (a, e, far) => {
    const Sx = shX - sl*ht*.012, Sy = shY + cl*ht*.028;
    const Ex = Sx + Math.sin(a)*uArmL, Ey = Sy + Math.cos(a)*uArmL;
    const a2 = a + e, Wx = Ex + Math.sin(a2)*fArmL, Wy = Ey + Math.cos(a2)*fArmL;
    const sk = far ? skinD : skin, cc = far ? topD : top;
    const w1 = ht*.058, w2 = ht*.045, w3 = ht*.037;
    if (lk.top === 'tank'){ seg(Sx, Sy, Ex, Ey, w1*.9, w2, sk); seg(Ex, Ey, Wx, Wy, w2, w3, sk); }
    else if (lk.top === 'tee'){
      seg(Sx, Sy, Ex, Ey, w1*.9, w2, sk);
      seg(Sx, Sy, lerp(Sx, Ex, .55), lerp(Sy, Ey, .55), w1*1.12, w2*1.2, cc);
      seg(Ex, Ey, Wx, Wy, w2, w3, sk);
    } else { seg(Sx, Sy, Ex, Ey, w1, w2*1.05, cc); seg(Ex, Ey, Wx, Wy, w2*1.05, w3*1.05, cc); }
    const hx = Wx + Math.sin(a2)*ht*.02, hy = Wy + Math.cos(a2)*ht*.02;
    ctx.fillStyle = sk; ell(hx, hy, ht*.022, ht*.026);
    return [hx, hy];
  };
  const drawTorso = () => {
    ctx.save(); ctx.translate(hipX, hipY); ctx.rotate(lean);
    const T = torsoL, d = ht*(lk.f ? .05 : .057);
    ctx.fillStyle = bot; ell(0, -T*.04, d*1.08, ht*.05);
    const g = ctx.createLinearGradient(-d, -T, d, 0);
    g.addColorStop(0, shade(top, -24)); g.addColorStop(1, shade(top, 14));
    const hem = lk.top === 'suit' ? T*.14 : T*.03;
    ctx.fillStyle = g; ctx.beginPath();
    ctx.moveTo(-d*.95, hem);
    ctx.quadraticCurveTo(-d*1.12, -T*.5, -d*.85, -T*.95);
    ctx.quadraticCurveTo(0, -T*1.08, d*.6, -T*.97);
    if (lk.f) ctx.quadraticCurveTo(d*1.4, -T*.72, d*.85, -T*.55);
    else ctx.quadraticCurveTo(d*1.12, -T*.76, d*.97, -T*.6);
    ctx.quadraticCurveTo(d*.75, -T*.3, d*.97, hem);
    ctx.closePath(); ctx.fill();
    if (lk.top === 'suit'){
      ctx.fillStyle = '#f4f4f4'; ctx.beginPath();
      ctx.moveTo(d*.2, -T*.98); ctx.lineTo(d*.72, -T*.95); ctx.lineTo(d*.6, -T*.62); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = lk.tie; ctx.lineWidth = ht*.022; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(d*.62, -T*.93); ctx.lineTo(d*.82, -T*.45); ctx.stroke();
      ctx.strokeStyle = shade(top, -30); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(d*.2, -T*.98); ctx.lineTo(d*.55, -T*.55); ctx.stroke();
    } else if (lk.top === 'hoodie'){
      ctx.fillStyle = shade(top, -18); ell(-d*.55, -T*1.0, d*.65, ht*.035);
      ctx.strokeStyle = shade(top, -30); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-d*.3, -T*.28); ctx.lineTo(d*.7, -T*.28); ctx.stroke();
    } else if (h.type === 'jogger'){
      ctx.fillStyle = '#fff'; rr(-d*.1, -T*.62, d*.85, T*.22, 1.5); ctx.fill();
      ctx.fillStyle = '#333'; rr(d*.12, -T*.55, d*.4, T*.07, 1); ctx.fill();
    }
    ctx.restore();
  };

  if (skate){
    ctx.fillStyle = '#c0392b'; rr(-Lg*.48, -lift, Lg*.96, 3.2, 1.6); ctx.fill();
    ctx.fillStyle = '#222'; ctx.fillRect(-Lg*.35, -lift + 3, 3, 2.5); ctx.fillRect(Lg*.32, -lift + 3, 3, 2.5);
    ctx.fillStyle = '#f5c542'; circ(-Lg*.33, -lift + 6.3, 2.6); circ(Lg*.34, -lift + 6.3, 2.6);
  }

  drawArm(aF, eF, true);
  drawLeg(LF, true);
  drawTorso();
  drawLeg(LN, false);
  if (lk.bottom === 'skirt'){
    const d = ht*.055, hemY = hipY + Lg*.4;
    const kMin = Math.min(LN.kx, LF.kx), kMax = Math.max(LN.kx, LF.kx);
    ctx.fillStyle = bot; ctx.beginPath();
    ctx.moveTo(-d, hipY - ht*.03); ctx.lineTo(d, hipY - ht*.03);
    ctx.lineTo(Math.max(d*1.6, kMax + ht*.04), hemY); ctx.lineTo(Math.min(-d*1.6, kMin - ht*.04), hemY);
    ctx.closePath(); ctx.fill();
  }
  // neck + head
  const nkX = shX + sl*neckL, nkY = shY - cl*neckL;
  seg(shX, shY + ht*.01, nkX + ht*.006, nkY, ht*.048, ht*.042, skin);
  ctx.save(); ctx.translate(nkX + ht*.006, nkY + ht*.008);
  ctx.rotate(lean*.4 + (h.state === 'aside' ? -.12 : 0));
  drawHead(lk, scared, headH/15, .3*Math.sin(P*Math.PI*4));
  ctx.restore();
  const hand = drawArm(aN, eN, false);
  if (h.type === 'business' && h.state === 'walk' && !h.scared){
    ctx.fillStyle = '#5a3a22'; rr(hand[0] - ht*.07, hand[1] + ht*.012, ht*.14, ht*.1, 2); ctx.fill();
    ctx.fillStyle = '#c9a24a'; ctx.fillRect(hand[0] - 1.5, hand[1] + ht*.05, 3, 2);
  }
  ctx.restore();

  if (h.say && h.sayT > 0){
    const by = GROUND - laneOff - h.y - (h.ht + lift)*sc - 22;
    ctx.globalAlpha = Math.min(1, h.sayT*3);
    ctx.font = '900 14px Nunito, sans-serif'; ctx.textAlign = 'center';
    const tw = ctx.measureText(h.say).width + 16;
    ctx.fillStyle = '#fff'; rr(sx - tw/2, by - 20, tw, 24, 10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx - 4, by + 3); ctx.lineTo(sx + 4, by + 3); ctx.lineTo(sx, by + 10); ctx.fill();
    ctx.fillStyle = h.state === 'bitten' ? '#d33b3b' : '#2b1d14'; ctx.fillText(h.say, sx, by - 3);
    ctx.globalAlpha = 1;
  }
}

/* ---------- HUD ---------- */
function panel(x, y, w, h){ ctx.fillStyle = 'rgba(255,246,230,.92)'; rr(x, y, w, h, 14); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,.08)'; rr(x, y + h - 4, w, 4, 2); ctx.fill(); }
function heart(x, y, s, full){
  ctx.fillStyle = full ? '#ff4d5e' : 'rgba(43,29,20,.18)';
  ctx.beginPath(); ctx.moveTo(x, y + s*.3);
  ctx.bezierCurveTo(x, y, x - s*.5, y, x - s*.5, y + s*.3);
  ctx.bezierCurveTo(x - s*.5, y + s*.6, x, y + s*.8, x, y + s);
  ctx.bezierCurveTo(x, y + s*.8, x + s*.5, y + s*.6, x + s*.5, y + s*.3);
  ctx.bezierCurveTo(x + s*.5, y, x, y, x, y + s*.3); ctx.fill();
}
function drawHUD(){
  const g = G, d = g.dog;
  ctx.textBaseline = 'alphabetic';
  // left: level + score + stamina
  panel(14, 12, 236, 86);
  ctx.textAlign = 'left'; ctx.fillStyle = '#7a6656'; ctx.font = '900 11px Nunito, sans-serif';
  ctx.fillText(`LEVEL ${g.i + 1} · ${g.L.name.toUpperCase()}`, 28, 32);
  ctx.fillStyle = '#2b1d14'; ctx.font = '26px "Lilita One", sans-serif';
  ctx.fillText(g.score.toLocaleString(), 28, 62);
  ctx.fillStyle = '#7a6656'; ctx.font = '900 10px Nunito, sans-serif'; ctx.fillText(d.tired ? 'PANTING…' : 'SPRINT', 28, 86);
  ctx.fillStyle = 'rgba(43,29,20,.12)'; rr(84, 77, 150, 10, 5); ctx.fill();
  ctx.fillStyle = d.tired ? '#ff6b5e' : '#ffb320'; rr(84, 77, Math.max(10, 150*d.stamina/100), 10, 5); ctx.fill();

  // center: bites progress
  const cx = W/2 - 160;
  panel(cx, 12, 320, 58);
  ctx.fillStyle = '#7a6656'; ctx.font = '900 11px Nunito, sans-serif'; ctx.fillText('BITES', cx + 16, 32);
  ctx.textAlign = 'right'; ctx.fillStyle = '#2b1d14'; ctx.font = '20px "Lilita One", sans-serif';
  ctx.fillText(`${g.bites} / ${g.L.goal}`, cx + 304, 34);
  ctx.fillStyle = 'rgba(43,29,20,.12)'; rr(cx + 16, 42, 288, 14, 7); ctx.fill();
  const pr = Math.min(1, g.bites/g.L.goal);
  if (pr > 0){ ctx.fillStyle = '#ff6b3d'; rr(cx + 16, 42, Math.max(14, 288*pr), 14, 7); ctx.fill(); }

  // right: time + lives
  panel(W - 250, 12, 236, 58);
  ctx.textAlign = 'left'; ctx.fillStyle = '#7a6656'; ctx.font = '900 11px Nunito, sans-serif'; ctx.fillText('TIME', W - 236, 32);
  const low = g.timeLeft <= 10;
  ctx.fillStyle = low && Math.floor(g.t*4) % 2 ? '#ff4d3d' : '#2b1d14'; ctx.font = '26px "Lilita One", sans-serif';
  ctx.fillText(Math.ceil(g.timeLeft) + 's', W - 236, 60);
  for (let k = 0; k < g.D.lives; k++) heart(W - 34 - k*26, 28, 22, k < g.lives);

  // combo
  if (g.combo > 1){
    const mult = Math.min(4, 1 + (g.combo - 1)*.5);
    ctx.textAlign = 'center'; ctx.font = '28px "Lilita One", sans-serif';
    const s = 1 + Math.max(0, g.comboT - 4.6)*1.2;
    ctx.save(); ctx.translate(W/2, 104); ctx.scale(s, s);
    ctx.fillStyle = '#2b1d14'; ctx.fillText(`COMBO x${mult.toFixed(1).replace('.0','')}`, 2, 3);
    ctx.fillStyle = '#7ef0ff'; ctx.fillText(`COMBO x${mult.toFixed(1).replace('.0','')}`, 0, 0);
    ctx.restore();
  }

  // banners
  ctx.textAlign = 'center';
  if (g.banner > 0 && !g.endType){
    const a = Math.min(1, g.banner, (3.2 - g.banner)*4);
    ctx.globalAlpha = a;
    bigText(`LEVEL ${g.i + 1}: ${g.L.name.toUpperCase()}`, W/2, 210, 46);
    ctx.font = '900 20px Nunito, sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(`Bite ${g.L.goal} humans in ${Math.round(g.L.time*g.D.time)}s  ·  ${g.D.label}`, W/2, 246);
    if (g.i === 0) { ctx.font = '800 15px Nunito, sans-serif'; ctx.fillText('→ run   ·   Space jump   ·   Shift sprint   ·   X bite', W/2, 274); }
    ctx.globalAlpha = 1;
  }
  if (g.endType){
    bigText(g.endType === 'win' ? 'LEVEL CLEAR!' : g.reason.toUpperCase(), W/2, 230, 60);
  }
  if (g.flash > 0){ ctx.fillStyle = `rgba(255,60,40,${g.flash*.8})`; ctx.fillRect(0, 0, W, H); }
}
function bigText(s, x, y, size){
  ctx.font = `${size}px "Lilita One", sans-serif`; ctx.textAlign = 'center';
  ctx.lineWidth = 8; ctx.strokeStyle = '#2b1d14'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y);
  ctx.fillStyle = '#ffc23d'; ctx.fillText(s, x, y);
}

/* ---------- render ---------- */
const demoDog = makeDog(0);
function render(dt){
  const s = cv.width/W;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (!G || state === 'menu'){
    menuT += dt;
    const cam = menuT*120;
    drawBG(LEVELS[selLevel].theme, cam, menuT);
    demoDog.x = cam + 180; demoDog.vx = 270; dogGait(demoDog, dt);
    drawDog(demoDog, cam, menuT);
    return;
  }
  const g = G;
  ctx.save();
  if (g.shake > 0) ctx.translate((Math.random() - .5)*g.shake, (Math.random() - .5)*g.shake);
  drawBG(g.L.theme, g.cam, g.t);
  for (const h of g.humans) if (h.lane > .02) drawHuman(h, g.cam, g.t);
  for (const o of g.obs) if (o.x - g.cam < W + 40) drawObstacle(o, g.cam);
  for (const b of g.bones) drawBone(b, g.cam, g.t);
  for (const h of g.humans) if (h.lane <= .02) drawHuman(h, g.cam, g.t);
  drawDog(g.dog, g.cam, g.t);
  for (const p of g.parts){
    ctx.globalAlpha = clamp(p.life/p.max, 0, 1);
    ctx.fillStyle = p.col; circ(p.x - g.cam, p.y, p.r);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of g.texts){
    ctx.globalAlpha = clamp(t.life*2, 0, 1);
    ctx.font = `${t.size}px "Lilita One", sans-serif`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(43,29,20,.85)'; ctx.lineJoin = 'round';
    ctx.strokeText(t.text, t.x - g.cam, t.y); ctx.fillStyle = t.col; ctx.fillText(t.text, t.x - g.cam, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHUD();
}

/* ---------- UI / overlays ---------- */
const $ = id => document.getElementById(id);
function hideAll(){ ['menu','pauseO','resultO'].forEach(id => $(id).classList.remove('show')); }

function buildMenu(){
  document.querySelectorAll('#diffs button').forEach(b => b.classList.toggle('on', b.dataset.d === diff));
  const unl = save.unlocked[diff] || 1;
  if (selLevel >= unl) selLevel = unl - 1;
  const box = $('levels'); box.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.className = 'lv' + (i === selLevel ? ' on' : '');
    b.disabled = i >= unl;
    b.innerHTML = `<b>${i >= unl ? '🔒' : i + 1}</b><span>${L.name}</span><span>${L.goal} bites</span>`;
    b.onclick = () => { selLevel = i; buildMenu(); };
    box.appendChild(b);
  });
  $('bestScore').textContent = (save.best || 0).toLocaleString();
}
document.querySelectorAll('#diffs button').forEach(b => b.onclick = () => { diff = b.dataset.d; buildMenu(); });
$('playBtn').onclick = startRun;

function toMenu(){ G = null; state = 'menu'; hideAll(); buildMenu(); $('menu').classList.add('show'); }
function pauseGame(){ if (state !== 'play') return; state = 'paused'; $('pauseO').classList.add('show'); }
function resumeGame(){ if (state !== 'paused') return; state = 'play'; hideAll(); if (document.activeElement) document.activeElement.blur(); last = performance.now(); }
$('resumeBtn').onclick = resumeGame;
$('quitBtn').onclick = toMenu;
$('pauseBtn').onclick = () => state === 'play' ? pauseGame() : state === 'paused' ? resumeGame() : null;
function toggleMute(){ muted = !muted; $('muteBtn').textContent = muted ? '✕' : '♪'; }
$('muteBtn').onclick = toggleMute;

function finishLevel(){
  const g = G; state = 'result';
  const stats = [], btns = [];
  let title, sub;
  if (g.endType === 'win'){
    const tb = Math.ceil(g.timeLeft)*10, lb = g.lives*150;
    stats.push(['Humans bitten', g.bites], ['Best combo', 'x' + g.maxCombo], ['Got away', g.escaped], ['Time bonus', '+' + tb], ['Lives bonus', '+' + lb]);
    g.score += tb + lb;
    runStart = g.score;
    save.unlocked[diff] = Math.min(LEVELS.length, Math.max(save.unlocked[diff] || 1, g.i + 2));
    const last = g.i === LEVELS.length - 1;
    if (last){
      title = 'TOP DOG!';
      sub = `You chomped your way through every level on ${g.D.label}. The whole city fears the bark.`;
      btns.push(['Play again', () => { runStart = 0; startLevel(0); }], ['Menu', toMenu, true]);
    } else {
      title = 'Level Clear!';
      sub = pick(['Who’s a good boy? You are.', 'Pure chomp-ion energy.', 'The humans will need bandages.', 'Fetch the next level!']);
      btns.push(['Next level ▶', () => startLevel(g.i + 1)], ['Menu', toMenu, true]);
      selLevel = g.i + 1;
    }
  } else {
    title = g.reason === "Time's up!" ? "Time's Up!" : 'Ruff Luck!';
    sub = g.reason === "Time's up!" ? `You needed ${g.L.goal - g.bites} more bite${g.L.goal - g.bites === 1 ? '' : 's'}.` : 'Too many bonks. Watch those obstacles!';
    stats.push(['Humans bitten', `${g.bites} / ${g.L.goal}`], ['Best combo', 'x' + g.maxCombo], ['Got away', g.escaped]);
    btns.push(['Retry', () => startLevel(g.i)], ['Menu', toMenu, true]);
  }
  save.best = Math.max(save.best || 0, g.score);
  persist();
  stats.push(['Score', g.score.toLocaleString()]);
  $('rTitle').textContent = title;
  $('rSub').textContent = sub;
  $('rStats').innerHTML = stats.map((r, i) => {
    const tot = i === stats.length - 1 ? ' tot' : '';
    return `<div class="${tot}">${r[0]}</div><div class="v${tot}">${r[1]}</div>`;
  }).join('');
  const bb = $('rBtns'); bb.innerHTML = '';
  for (const [label, fn, ghost] of btns){
    const b = document.createElement('button'); b.className = 'btn' + (ghost ? ' ghost' : ''); b.textContent = label; b.onclick = fn; bb.appendChild(b);
  }
  $('resultO').classList.add('show');
  setTimeout(() => { const f = bb.querySelector('button'); if (f) f.focus(); }, 50);
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(1/30, Math.max(0, (now - last)/1000));
  last = now;
  if (state === 'play' && G) update(dt);
  render(dt);
  requestAnimationFrame(frame);
}
buildMenu();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
})();
</script>
